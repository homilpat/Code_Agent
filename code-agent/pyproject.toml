[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "knowledge-hub-code-agent"
version = "0.1.0"
description = "Local trusted orchestration core for Knowledge Hub Code Intelligence"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["typer>=0.16,<1", "PyYAML>=6.0.2,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[project.scripts]
kh = "kh_agent.cli.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kh_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
