services:
  # 1. RDBMS (MySQL 8.0)
  mysql-db:
    image: mysql:8.0
    container_name: knowledge_mysql
    restart: always
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      TZ: ${APP_TIMEZONE:?APP_TIMEZONE is required}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - app-network

  # 2. Vector DB (Qdrant)
  vector-db:
    image: qdrant/qdrant:latest
    container_name: knowledge_qdrant
    restart: always
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - app-network

  # 3. AI / RAG 서빙 엔진 (FastAPI + BGE-M3 + LM Studio 연동)
  rag-fastapi:
    build:
      context: ./rag-fastapi
      dockerfile: Dockerfile
    container_name: knowledge_rag_fastapi
    restart: always
    gpus: all
    environment:
      QDRANT_HOST: ${QDRANT_HOST:?QDRANT_HOST is required}
      QDRANT_PORT: ${QDRANT_INTERNAL_PORT:?QDRANT_INTERNAL_PORT is required}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:?QDRANT_COLLECTION is required}
      RAG_INTERNAL_PORT: ${RAG_INTERNAL_PORT:?RAG_INTERNAL_PORT is required}
      LM_STUDIO_URL: ${LM_STUDIO_URL:?LM_STUDIO_URL is required}
      LM_STUDIO_API_KEY: ${LM_STUDIO_API_KEY:?LM_STUDIO_API_KEY is required}
      LLM_MODEL: ${LLM_MODEL:?LLM_MODEL is required}
      PLANNER_MODEL: ${PLANNER_MODEL:?PLANNER_MODEL is required}
      ANSWER_MODEL: ${ANSWER_MODEL:?ANSWER_MODEL is required}
      RERANKER_MODEL_NAME: ${RERANKER_MODEL_NAME:-BAAI/bge-reranker-v2-m3}
      MIN_SEARCH_SCORE: ${MIN_SEARCH_SCORE:?MIN_SEARCH_SCORE is required}
    command: ["sh", "-c", "uvicorn app.main:app --host 0.0.0.0 --port $$RAG_INTERNAL_PORT"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:$$RAG_INTERNAL_PORT/api/rag/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - vector-db
    volumes:
      - hf_cache:/root/.cache/huggingface
      - ./rag-fastapi/evaluation/results:/app/evaluation/results
      - ./rag-fastapi/evaluation/regressions:/app/evaluation/regressions
    networks:
      - app-network

  # 4. 메인 비즈니스 백엔드 (Java 17 + Spring Boot + MyBatis)
  backend-spring:
    build:
      context: ./backend-spring
      dockerfile: Dockerfile
    container_name: knowledge_spring_backend
    restart: always
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:?BACKEND_HOST_PORT is required}:${BACKEND_INTERNAL_PORT:?BACKEND_INTERNAL_PORT is required}"
    environment:
      SERVER_PORT: ${BACKEND_INTERNAL_PORT:?BACKEND_INTERNAL_PORT is required}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:?SPRING_DATASOURCE_URL is required}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:?SPRING_DATASOURCE_USERNAME is required}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?SPRING_DATASOURCE_PASSWORD is required}
      RAG_FASTAPI_URL: ${RAG_FASTAPI_URL:?RAG_FASTAPI_URL is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRATION_SECONDS: ${JWT_EXPIRATION_SECONDS:?JWT_EXPIRATION_SECONDS is required}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?ADMIN_USERNAME is required}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL is required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      UPLOADS_DIRECTORY: /app/uploads
    volumes:
      - blog_uploads:/app/uploads
    depends_on:
      mysql-db:
        condition: service_started
      rag-fastapi:
        condition: service_healthy
    networks:
      - app-network

  # 5. 블로그 웹 프론트엔드 (Next.js)
  frontend-blog:
    build:
      context: ./frontend-nextjs
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
    container_name: knowledge_frontend_blog
    restart: always
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:?FRONTEND_HOST_PORT is required}:${FRONTEND_INTERNAL_PORT:?FRONTEND_INTERNAL_PORT is required}"
    environment:
      PORT: ${FRONTEND_INTERNAL_PORT:?FRONTEND_INTERNAL_PORT is required}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
    depends_on:
      - backend-spring
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mysql_data:
  qdrant_data:
  blog_uploads:
  hf_cache:
