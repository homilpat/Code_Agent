[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "code-agent-cli"
version = "0.1.0"
description = "Standalone local-first coding agent with source-aware checks and sandboxed verification"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "JongHyeok Jang" }]
requires-python = ">=3.11"
dependencies = ["typer>=0.16,<1", "PyYAML>=6.0.2,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[project.scripts]
code-agent = "kh_agent.cli.app:main"
kh = "kh_agent.cli.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kh_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.pyright]
include = ["src"]
extraPaths = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "standard"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"evals/tests/**" = ["S101"]
"evals/tasks/**/hidden/test_*.py" = ["S101"]
