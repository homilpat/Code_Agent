name: Code Agent CLI

on:
  push:
    paths:
      - '.github/workflows/code-agent-sandbox.yml'
      - 'src/**'
      - 'tests/**'
      - 'config/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'docs/ARCHITECTURE_DETAILED_DESIGN_v1.10.md'
  pull_request:
    paths:
      - '.github/workflows/code-agent-sandbox.yml'
      - 'src/**'
      - 'tests/**'
      - 'config/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'docs/ARCHITECTURE_DETAILED_DESIGN_v1.10.md'

permissions:
  contents: read

jobs:
  sandbox-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install project and rootless Podman
        run: |
          python -m pip install uv
          uv sync --extra dev --locked
          sudo apt-get update
          sudo apt-get install -y podman uidmap slirp4netns fuse-overlayfs
      - name: Check sandbox prerequisites
        run: |
          test "$(podman info --format '{{.Host.Security.Rootless}}')" = true
          test "$(stat -fc %T /sys/fs/cgroup)" = cgroup2fs
          podman info --format '{{.Host.OCIRuntime.Name}}'
      - name: Build pinned test images
        run: |
          podman build --pull=always -t localhost/kh-python-pytest:v1 \
            -f config/sandbox/python-pytest.Containerfile config/sandbox
          podman build --pull=always -t localhost/kh-python-pyright:v1 \
            -f config/sandbox/python-pyright.Containerfile config/sandbox
          podman image inspect localhost/kh-python-pytest:v1 >/dev/null
          podman image inspect localhost/kh-python-pyright:v1 >/dev/null
      - name: CLI smoke
        run: |
          uv run code-agent --help
          uv run code-agent doctor
      - name: Real Podman and pyright integration tests
        env:
          KH_REQUIRE_SANDBOX_TESTS: '1'
        run: |
          uv run pytest -q tests/test_sandbox_container_linux.py tests/test_lsp_sandbox_linux.py
      - name: Other Code Agent tests and evaluation harness
        run: |
          uv run pytest -q --ignore=tests/test_sandbox_container_linux.py --ignore=tests/test_lsp_sandbox_linux.py
          uv run python -m pytest -q evals/tests -p no:cacheprovider
      - name: MCP v2 SDK stdio protocol smoke
        run: |
          uv run --with 'mcp>=2,<3' python - <<'PY'
          import sys
          import anyio
          from mcp import Client, StdioServerParameters

          async def run():
              params = StdioServerParameters(
                  command=sys.executable,
                  args=["-m", "kh_agent.mcp_server"],
              )
              async with Client(params) as client:
                  tools = await client.list_tools()
                  names = {tool.name for tool in tools.tools}
                  expected = {
                      "repository_status",
                      "audit_history",
                      "explain_python",
                      "impact_candidates",
                      "propose_python_change",
                  }
                  assert names == expected, (names, expected)
                  outcome = await client.call_tool(
                      "repository_status", {"repository": "relative/not-registered"}
                  )
                  assert not outcome.is_error, outcome
                  assert outcome.structured_content["error"] == "INVALID_ARGUMENT"
                  assert outcome.structured_content["ok"] is False

          anyio.run(run)
          PY
      - name: Ruff static checks and formatting
        run: |
          uv run ruff check .
          uv run ruff format --check src tests evals
